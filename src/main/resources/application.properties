spring.datasource.url=jdbc:h2:file:./data/tradetracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always
app.upload-dir=uploads

marketplace.indiamart.enabled=false
marketplace.indiamart.api-key=
marketplace.indiamart.api-base-url=

marketplace.alibaba.enabled=false
marketplace.alibaba.api-key=
marketplace.alibaba.api-base-url=
